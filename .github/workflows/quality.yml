name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Fast fail-first lane (~3-4 min): every gate EXCEPT the test suite. A lint slip,
  # type error, size overrun, or mirror drift reports here long before the suite
  # lane finishes — the suite lane no longer queues behind the cheap checks.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Keyless CI: dev tooling only. Live deps (LLM/Gmail/tunnel) are never installed here.
      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict, src)
        run: uv run mypy src/

      - name: File-size check (150 source lines)
        run: uv run python scripts/check_file_sizes.py

      - name: Anti-pattern check
        run: uv run python scripts/check_anti_patterns.py

      - name: No-hardcoded check
        run: uv run python scripts/check_no_hardcoded.py

      - name: Core-mirror manifest check
        run: uv run python scripts/sync_core.py --verify

      # Kit CORE conformance — byte-level interop, CI-blocking (CLAUDE.md §1 #13).
      - name: Kit CORE vectors
        run: |
          if [ -d tests/conformance ]; then
            uv run pytest tests/conformance -v
          else
            echo "tests/conformance not yet populated (M1) — skipped"
          fi

      - name: Self-grade config validation
        run: uv run python scripts/self_grade.py --validate

      - name: Submission checklist (non-blocking report until M8)
        run: uv run python scripts/check_submission.py

  # The suite lane keeps the historical job id `quality` so anything keyed to that
  # check name still points at a blocking gate. Runs in PARALLEL with `gates`,
  # ON THE SELF-HOSTED 24-core runner (label fast24, one registered per repo):
  # GitHub's 2-core VM ran this suite in ~25 min; the local runner + xdist runs it
  # in ~2 min. If the runner is offline this lane QUEUES - restart it with the
  # one-liner in the ops runbook/memory. Arena seeds and the solver node cap stay
  # untouched: they are the measurement, not speed knobs. --dist loadscope keeps
  # each test module on one worker so the arena module's shared round-robin
  # fixture is computed once.
  quality:
    runs-on: [self-hosted, fast24]
    # 25 -> 35 (M12): the champion evader's k-wall forecast now runs k=4 in the
    # gate arena (C(sites,4) combos per decision - the measurement, not a speed
    # knob), which grew the arena-harness module to ~6 min standalone. The cap
    # stays a runaway backstop, not a performance target.
    timeout-minutes: 35
    env:
      # Persistent LOCAL uv cache (2026-08-11): with the hosted cache
      # (enable-cache: true) every runner restart cost a ~10-minute cold run —
      # network cache restore + full venv rebuild — on a box that keeps its own
      # disk. Local dir survives restarts and reboots; only the self-hosted lane
      # uses it (the ubuntu gates lane keeps the hosted cache, which is correct
      # for an ephemeral VM).
      UV_CACHE_DIR: D:\uv-ci-cache
    defaults:
      run:
        # The dev machine's PowerShell execution policy blocks the runner's
        # generated .ps1 step scripts (PSSecurityException); Git Bash sidesteps
        # policy without changing system state, and is present on the machine.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          # Hosted cache OFF here: it would override UV_CACHE_DIR and re-download
          # the environment after every runner restart (see job env above).
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Tests with coverage
        run: uv run pytest -n auto --dist loadscope --cov=src --cov-report=xml --cov-fail-under=85
