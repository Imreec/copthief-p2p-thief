# Private per-peer config (book App B s4): never crosses the wire, never negotiated.
# game.json overlays this file on shared keys - the private file can never weaken a signed term.
# [trash_talk]/[llm]/[email] arrive with their milestones (M5/M6).

version = "1.06"

[game]
group_name = "ImreEyal-Thief"
group_id = "imreeyal"
sub_game_number = 1
# Group identity (F8b): exchanged in the handshake so the opponent can build the
# whole-match declaration; the reference's writer requires every key.
members = ["Imree Cohen", "Eyal Shtinmetz"]
llm_model = "none"
# M7-41 league ledger (book §9.2.1; rules 37-38) — MUST stay identical to the police
# repo's config/game.toml: either repo can be the one declaring at a handshake, and a
# stale count makes the NEXT counted game declare a false first meeting (rule 38 =
# project-level disqualification). Advanced 2026-08-04 after the first counted series
# vs anrbj666 (30-90). Warm-ups never move these numbers. Advanced 2026-08-10 after the
# third counted series vs vibecode (30-90). Advanced 2026-08-11 after the fourth counted
# series vs nis-yar1 (90-30 sweep, +10 diversity as winner of the first meeting).
counted_games_played = 4
counted_opponents = ["anrbj666", "uoh-sqak", "vibecode", "nis-yar1"]

[game.repos]
cop = "https://github.com/Imreec/copthief-p2p-cop"
thief = "https://github.com/Imreec/copthief-p2p-thief"

[game.mcp_servers]
cop = "https://cop.imreeyal.com/mcp"
thief = "https://thief.imreeyal.com/mcp"

[strategy]
# Private brain selection (PLAN s7): which BrainBase class each role runs (book s6.2
# package.module:Class notation for role brains). The sparring host stays on the
# generic brain - tuned weights never deploy there (CLAUDE.md s9).
police_class = "random"
# M9 (ADR-0011 in the lead repo): the doctrine evader — lethal gate above flight,
# belief-native worst-wall forecast, stay cap, hunted-only flee lift. The counted
# 30-90 corner deaths refuse at their first step. The old ThiefBrain stays available
# by flipping this line back; its tuned tables below are inert under the doctrine
# brain (unknown keys are tolerated, nothing reads them).
thief_class = "doctrine-evader"
# M5-6 A/B winner (docs/evidence/m5-template-ab.md): banks measured identical
# against our closed-vocabulary parser - classic retained on the survivals tiebreak.
hint_bank = "classic"

[strategy.police]
# M9-5 claim gate (mirrored gate pin in tests/unit/peer/test_claims.py requires the
# live config to carry it): claim only when the landing's own belief mass clears
# this. This repo's police side is the generic sparring stand-in, but the gate is a
# property of the SHIPPED stack in both repos — 0.1 = the published sweep's point.
claim_threshold = 0.1
tie_epsilon = 0.25

[strategy.thief]
# ThiefBrain knobs: the canonical defaults live in copthief_thief/features.py
# (DEFAULT_OPTIONS data table, AppFTable pattern); keys here override them.
# The M5-4 GA writes tuned values into this table - code never changes.
# M10 room-first flight (cop-repo ADR-0012, the vibecode 30-90 lesson): read by
# the FIELDED doctrine-evader brain (core mirror). Hunted max-distance flight IS
# the herding gradient - three identical corner deaths with the cop's exact cell
# known every turn. room_first demotes raw flight below the worst-wall room terms
# past the flight_floor default (doctrine_evader.py table); 0.0 restores the M9
# ordering byte-for-byte. Hand-propagated: config never travels with the mirror.
room_first = 1.0
# M11-1 cage-escape (cop-repo ADR-0013, the police-m10 32/32 hole + the nis-yar1
# step-13 corner kills): k-wall pocket forecast + orbit margin + low flight floor.
cage_escape = 1.0
forecast_walls = 3.0
forecast_wall_reach = 2.0
flight_floor = 2.0
center_margin_cap = 2.0
ramp_multiplier = 1.3136
ramp_start_fraction = 0.9496
trap_size_fraction = 0.2945
w_articulation = 8.1599
w_distance = 5.2704
w_region = 1.8097
w_spread = 1.0655

[strategy.thief.multiplicative_book_v1]
# M7-21 (supersedes M7-16 on this overlay): retuned for an INFORMED thief. M7-16 evolved
# its vector under a HIDDEN feed; M7-18 then taught the thief to read the opponent cop's
# capture claims, so those weights were tuned for a blinder agent than we now field. The
# GA pool mixes information worlds (two cops we can read, one QUIET cop we cannot, plus a
# random walker) so the vector cannot over-rely on information.
# Headline: w_articulation falls from the ceiling 40.0 to 8.93 - the elaborate
# anti-cornering machinery was carrying a blind evader, and an informed one is better off
# simply keeping distance from the cell it KNOWS the cop occupies.
# Gate (docs/evidence/m7-21-informed-thief.md, held-out seeds 1..32, both physics):
# book-v1 1260 vs the previous overlay's 1170 (survivals 124/128 vs 106/128, better or
# equal on EVERY arm); reference 950 vs 925. The BASE table below is untouched - under
# reference physics this vector only TIES it (950-950), which is no reason to change it.
ramp_multiplier = 3.546170631626467
ramp_start_fraction = 0.3
trap_size_fraction = 0.20126612510301556
w_articulation = 8.928429525952911
w_distance = 4.562212626629817
w_region = 2.030098462268734
w_spread = 1.7843591354096908
# M11 overlay pin (ADR-0013 item 3a): M10/M11 mechanisms unmeasured under
# book-v1 physics - explicit OFF so base-table arming cannot fall through.
room_first = 0.0
cage_escape = 0.0
flight_floor = 3.0
center_margin_cap = 0.0

[scent]
# Which NAMED scent model we play (M3-8, ADR-0004 v2; registrations in
# config/locked_models.json, kit SPEC s7). Private until the handshake, which declares
# only the model's HASH - the doc itself never crosses the wire.
#   subtractive_chebyshev_v1 = the reference form, our default. Byte-identical to what
#                              M3-2 shipped; this is what plays against the reference peer.
#   multiplicative_book_v1   = the book ch.4 model. Set this ONLY for a pair that has
#                              agreed to lock it - a peer that declares a different model
#                              refuses the game (both-declare-and-differ, rule s7).
model = "subtractive_chebyshev_v1"
# M6-7 audit sensitivity: how far a re-derived cell may sit from the transmitted one
# before the scent-physics check calls it a mismatch. IGNORED for a model that rounds
# (the reference form is round-3 exact, so any difference is a difference). It binds
# only for a no-rounding model like multiplicative_book_v1, where two HONEST peers
# differ in the last IEEE-754 bit because each side recomputes rather than receives.
# Private, evidence-grade only (SQ3) - never negotiated, never flips a result.
physics_tolerance = 1e-9

[belief]
# Private evidence-trust tuning (PRD_belief s5): how sharply the scent/hint likelihoods
# multiply into the Bayes filter. Never signed, never crosses the wire (SQ3 stance:
# the transmitted grid is unauthenticated - trust is a tunable, never an axiom).
smell_trust_weight = 4.0
hint_trust_default = 1.0
# M5-5 profiling: the post-audit lie-rate scales the NEXT mini-game's hint trust
# down toward (never past) this floor - distrust-but-never-eliminate.
profile_hint_floor = 0.2
# M9-2: the sharp fresh-peak tier (lead ADR-0011). Under subtractive_chebyshev_v1 the
# age-zero stamp names the emitter cell exactly - for the THIEF this is what feeds the
# lethal gate and the hunted-flee lift with the cop's true cell. Strong multiplier on
# purpose (x200 on the peak); ambiguous/stale frames abstain to the voucher path; SQ3
# holds (boost, never eliminate). 0.0 disables (the pre-M9 filter byte-for-byte).
fresh_peak_trust = 199.0

[gui]
# Live-view render knobs (PRD_gui_replay s7, police repo): display-only, never
# negotiated. The heatmap anchors are the p=0 / p=1 colors of the belief shading
# (book fig. 9); the theme block is the dark-slate window chrome.
refresh_ms = 200
cell_px = 64
heat_low = "#1e293b"
heat_high = "#dc2626"
png_dpi = 150
font_family = "Segoe UI"
font_size = 11
theme_bg = "#0f172a"
theme_panel = "#1e293b"
theme_fg = "#e2e8f0"
accent = "#38bdf8"

[network]
my_port = 8801
opponent_url = ""
# Private timing budget (M2 F1 symmetric loop): opponent silent past turn_timeout ->
# technical loss; poll paces inbox drains; connect bounds handshake/audit waits.
turn_timeout_seconds = 180
poll_interval_seconds = 0.5
connect_timeout_seconds = 60
# M7-57: the deadline on ONE outbound tool call. Every budget above bounds a whole
# exchange; none bounded a single delivered-but-unanswered push, so that push inherited
# the transport library's own default and blocked for it. Must stay under the SIGNED
# response_timeout_sec (30) so a first attempt AND a retry both fit inside the deadline
# the opponent enforces - loader-asserted in shared/budgets.py rule 6.
call_timeout_seconds = 10
# M7-8 at-least-once tolerance: how many steps AHEAD of the awaited one we hold before
# calling it a flood. A lost HTTP ack makes the sender retry, so two of the opponent's
# pushes can be in flight at once and land out of order; anything past this window is
# a protocol violation, not a tunnel artifact. 1 covers the realistic race (one step
# ahead) - raise it only with a drill that shows a deeper reorder actually happening.
inbound_buffer_limit = 1
# M7-43: a window whose HANDSHAKE never completed is retried at the SAME sub-game
# index this many times before the series gives up. A window that produced a result
# (including a technical loss) spends its index instead.
handshake_retry_budget = 3

[email]
# M7-6 automatic report rail (ADR-0008, police repo; PRD_reporting s5a). App E rule
# 32 requires automatic reporting and rule 35 zeroes BOTH teams when one side fails to
# report, so there is no post-game human step. THE AUTHORIZATION IS THE RECIPIENT: with
# none configured nothing can leave, whatever else is set. Resting state = disabled, no
# recipient. Per run: the lecturer alone for a counted series
# (rmisegal+uoh26finalgame@gmail.com - the book's sole binding address, and never set
# before the friendlies have proven the format on both sides), or us + the opponent team
# for a friendly report exchange. sender = the dedicated team Gmail account, SHARED with
# the police repo (one identity, one consent, OI-5). Runaway protection is the
# gatekeeper (rule 28, rate_limits.json).
# KEEP THIS SECTION LAST: the settings tests derive the "absent section" case by
# cutting the file at the [email] header.
enabled = false
mode = "send"
recipient = []
sender = ""
token_path = "token.json"
# The book's sole binding reporting address (s9.3). Naming it here is what ARMS the
# guard: the interlock refuses this address whenever `counted` is false, and an
# unnamed lecturer is an unprotected one. `counted` cannot be set by accident - it
# arms the App F counted rows, so a counted constitution will not load unless it is a
# genuine six-mini-game match. Friendlies are unaffected.
lecturer = "rmisegal+uoh26finalgame@gmail.com"
