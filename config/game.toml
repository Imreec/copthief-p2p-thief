# Private per-peer config (book App B s4): never crosses the wire, never negotiated.
# game.json overlays this file on shared keys - the private file can never weaken a signed term.
# M1 carries only the sections the walking skeleton reads; [strategy]/[trash_talk]/[llm]/[email]
# arrive with their milestones (M5/M6).

version = "1.00"

[game]
group_name = "ImreEyal-Thief"
group_id = "imreeyal"
sub_game_number = 1
# Group identity (F8b): exchanged in the handshake so the opponent can build the
# whole-match declaration; the reference's writer requires every key.
members = ["Imree Cohen", "Eyal Shtinmetz"]
llm_model = "none"

[game.repos]
cop = "https://github.com/Imreec/copthief-p2p-cop"
thief = "https://github.com/Imreec/copthief-p2p-thief"

[game.mcp_servers]
cop = "https://cop.imreeyal.com/mcp"
thief = "https://thief.imreeyal.com/mcp"

[network]
my_port = 8801
opponent_url = ""
# Private timing budget (M2 F1 symmetric loop): opponent silent past turn_timeout ->
# technical loss; poll paces inbox drains; connect bounds handshake/audit waits.
turn_timeout_seconds = 180
poll_interval_seconds = 0.5
connect_timeout_seconds = 60
