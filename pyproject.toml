[project]
name = "copthief-p2p-thief"
version = "1.00"
description = "Thief agent — Distributed Cops-and-Robbers over a P2P network (final project, book v3.0.0)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Imree Cohen" }, { name = "Eyal Shtinmetz" }]
# Runtime deps arrive with their milestones (fastmcp at M1); dev tooling only for M0.
dependencies = [
    "fastmcp>=3.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    # D2 (PRD_gui_replay §8, police repo): analysis-time only — match-time code never
    # imports it; CI needs it for the keyless PNG-export smoke (Agg backend, offline).
    "pytest-xdist>=3.8.0",
    { include-group = "viz" },
    # M5-7: notebook build/execution + the renders-clean CI pin (nbformat parse).
    { include-group = "notebook" },
]
viz = [
    "matplotlib>=3.8",
    # M8-1: GIF assembly for scripts/render_replay_gif.py (analysis-time only).
    "pillow>=10.0",
]
notebook = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
# M6-4 (PRD_reporting §9 D5): the live Gmail path only — operator machines, never
# keyless CI (dev deliberately does NOT include this group; the code imports the
# SDK lazily inside the live methods).
email-live = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]

[project.scripts]
copthief = "copthief_core.sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copthief_core", "src/copthief_thief"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN", "RET", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# M6-4: the Google SDK lives only in the operator-side `email-live` group; keyless
# CI (and local strict runs) treat it as Any behind the lazy imports (HW6 pattern).
[[tool.mypy.overrides]]
module = ["google.*", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a real LLM / network / deployed server — excluded from CI",
    # ADR-0018 (post-league): heavy strategy-measurement evals (champion-gate arena,
    # DoD floors, GA smoke). Excluded from the default run; the on-demand arena
    # workflow runs them, and they stay MANDATORY before merging any strategy change.
    "arena: slow strategy-measurement evals — on-demand lane, excluded from default CI",
]
addopts = "-m 'not live and not arena'"

[tool.coverage.run]
source = ["src"]
# Live-transport adapters (real FastMCP server/client, two-process driver) are exercised
# by @pytest.mark.live runs and the committed p2p evidence log, not by keyless CI (PLAN §12).
omit = [
    "*/tests/*",
    # D3 (PRD_gui_replay §8): only the window shells are omitted — gui/models is
    # pure, tested, and coverage-counted.
    "src/**/gui/windows/*",
    "src/main.py",
    "src/copthief_core/infra/mcp_server.py",
    "src/copthief_core/infra/mcp_client.py",
    "src/copthief_core/infra/p2p_transport.py",
]

[tool.coverage.report]
fail_under = 85
