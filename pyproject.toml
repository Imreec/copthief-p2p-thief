[project]
name = "copthief-p2p-thief"
version = "1.00"
description = "Thief agent — Distributed Cops-and-Robbers over a P2P network (final project, book v3.0.0)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Imree Cohen" }, { name = "Eyal Shtinmetz" }]
# Runtime deps arrive with their milestones (fastmcp at M1); dev tooling only for M0.
dependencies = [
    "fastmcp>=3.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
copthief = "copthief_core.sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copthief_core", "src/copthief_thief"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN", "RET", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real LLM / network / deployed server — excluded from CI"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["src"]
# Live-transport adapters (real FastMCP server/client, two-process driver) are exercised
# by @pytest.mark.live runs and the committed p2p evidence log, not by keyless CI (PLAN §12).
omit = [
    "*/tests/*",
    "src/**/gui/*",
    "src/main.py",
    "src/copthief_core/infra/mcp_server.py",
    "src/copthief_core/infra/mcp_client.py",
    "src/copthief_core/infra/p2p_transport.py",
]

[tool.coverage.report]
fail_under = 85
